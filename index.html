<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem pencarian Data & Admin WA</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; color: #333; }
    .container { max-width: 1100px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; color: #075E54; }
    .controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    input[type="text"] { flex: 1; min-width: 200px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
    button { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: #fff; }
    .btn-search { background-color: #007bff; }
    .btn-wa-single { background-color: #25D366; }
    .btn-wa-group { background-color: #075E54; }
    .table-responsive { overflow-x: auto; margin-top: 15px; }
    table { width: 100%; border-collapse: collapse; min-width: 800px; }
    th, td { padding: 10px; border: 1px solid #ddd; text-align: left; font-size: 14px; }
    th { background-color: #f8f9fa; }
    tr:hover { background-color: #f1f1f1; }
    .meta-info { font-weight: bold; margin-bottom: 10px; color: #666; }
  </style>
</head>
<body>

<div class="container">
  <h2>Dashboard Pencarian & Rekap Data</h2>
  
  <div class="controls">
    <input type="text" id="searchInput" onkeyup="filterData()" placeholder="Cari Nama, CID, ODP, POP, SN Unit...">
    <button class="btn-search" onclick="loadDataFromGAS()">🔄 Muat / Refresh Data</button>
  </div>

  <div class="controls">
    <button class="btn-wa-single" onclick="kirimTerpisahSekaligus()">📲 Kirim Terpisah (1 Data = 1 WA)</button>
    <button class="btn-wa-group" onclick="kirimPesanGabungan()">📋 Kirim Gabungan (All-in-1 WA)</button>
  </div>

  <div class="meta-info" id="searchResultCount">Total Hasil: 0 Data</div>

  <div class="table-responsive">
    <table>
      <thead>
        <tr>
          <th style="width: 40px; text-align: center;">
            <input type="checkbox" id="selectAllCheckbox" onclick="toggleSelectAll(this)">
          </th>
          <th>Waktu</th>
          <th>Nama</th>
          <th>CID</th>
          <th>ODP</th>
          <th>POP</th>
          <th>SN Unit</th>
          <th>Sheet</th>
          <th>Keterangan</th>
        </tr>
      </thead>
      <tbody id="tableBodyAdmin">
        <tr>
          <td colspan="9" style="text-align: center; color: #888;">Klik "Muat / Refresh Data" untuk mengambil data.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // GANTI SAMA URL WEB APP HASIL DEPLOY KAMU
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwESnxnJqIkgKIkEOc2UMr4uG9esO7l2wiGQ8q6uGNMLGYE6HAATTyRaXenGs5ok0HJSw/exec";

  // Variabel Global
  window.rawAdminData = [];
  window.currentFilteredData = [];

  // 1. MEMUAT DATA DARI GOOGLE APPS SCRIPT
  async function loadDataFromGAS() {
    const tbody = document.getElementById('tableBodyAdmin');
    tbody.innerHTML = '<tr><td colspan="9" style="text-align: center;">Sedang mengambil data dari Google Sheets...</td></tr>';

    try {
      const response = await fetch(GAS_WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify({ action: "getRekap" })
      });
      
      const result = await response.json();

      if (result.success) {
        window.rawAdminData = result.data || [];
        window.currentFilteredData = [...window.rawAdminData];
        renderAdminTable(window.currentFilteredData);
      } else {
        alert("Gagal memuat data: " + result.message);
      }
    } catch (err) {
      alert("Terjadi kesalahan jaringan/CORS: " + err);
    }
  }

  // 2. RENDER TABLE KE HTML
  function renderAdminTable(data) {
    window.currentFilteredData = data || [];
    const tbody = document.getElementById('tableBodyAdmin');
    const countElem = document.getElementById('searchResultCount');
    const selectAll = document.getElementById('selectAllCheckbox');

    if (countElem) countElem.innerText = `Total Hasil: ${window.currentFilteredData.length} Data`;
    if (selectAll) selectAll.checked = false;

    if (!data || data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="9" style="text-align: center; color: #888;">Data tidak ditemukan.</td></tr>';
      return;
    }

    let html = '';
    data.forEach((item, index) => {
      html += `
        <tr>
          <td style="text-align: center;">
            <input type="checkbox" class="row-checkbox" data-index="${index}">
          </td>
          <td>${item.waktu || '-'}</td>
          <td><b>${item.namaLama || '-'}</b></td>
          <td>${item.cidLama || '-'}</td>
          <td>${item.odp || '-'}</td>
          <td>${item.pop || '-'}</td>
          <td>${item.snUnit || '-'}</td>
          <td>${item.sheetAsal || '-'}</td>
          <td>${item.keterangan || '-'}</td>
        </tr>
      `;
    });

    tbody.innerHTML = html;
  }

  // 3. FUNGSI FILTER/SEARCH KETIK OTOMATIS
  function filterData() {
    const keyword = document.getElementById('searchInput').value.toLowerCase();
    
    const filtered = window.rawAdminData.filter(item => {
      return (
        (item.namaLama && item.namaLama.toLowerCase().includes(keyword)) ||
        (item.cidLama && item.cidLama.toLowerCase().includes(keyword)) ||
        (item.odp && item.odp.toLowerCase().includes(keyword)) ||
        (item.pop && item.pop.toLowerCase().includes(keyword)) ||
        (item.snUnit && item.snUnit.toLowerCase().includes(keyword)) ||
        (item.sheetAsal && item.sheetAsal.toLowerCase().includes(keyword))
      );
    });

    renderAdminTable(filtered);
  }

  // 4. MENGAMBIL CHECKBOX TERTERA
  function getCheckedRows() {
    const checkboxes = document.querySelectorAll('.row-checkbox:checked');
    const selectedData = [];
    
    checkboxes.forEach(cb => {
      const index = cb.getAttribute('data-index');
      if (index !== null && window.currentFilteredData[index]) {
        selectedData.push(window.currentFilteredData[index]);
      }
    });

    return selectedData;
  }

  // 5. FITUR KIRIM TERPISAH (1 DATA = 1 WA) - JEDA 2 DETIK
  async function kirimTerpisahSekaligus() {
    const selectedData = getCheckedRows();
    
    if (selectedData.length === 0) {
      alert("Pilih/centang minimal satu data yang ingin dikirim!");
      return;
    }

    const noHpTujuan = prompt("Masukkan Nomor WA Tujuan (Contoh: 628123456789):");
    if (!noHpTujuan) return;

    if (!confirm(`Akan mengirim ${selectedData.length} pesan terpisah. Lanjutkan?`)) return;

    for (let i = 0; i < selectedData.length; i++) {
      const item = selectedData[i];
      
      let pesan = `*DETAIL DATA* (${i + 1}/${selectedData.length})\n`;
      pesan += `Nama: ${item.namaLama || '-'}\n`;
      pesan += `CID: ${item.cidLama || '-'}\n`;
      pesan += `ODP: ${item.odp || '-'}\n`;
      pesan += `POP: ${item.pop || '-'}\n`;
      pesan += `SN Unit: ${item.snUnit || '-'}\n`;
      pesan += `Sheet: ${item.sheetAsal || '-'}\n`;

      const encodedText = encodeURIComponent(pesan);
      const waUrl = `https://api.whatsapp.com/send?phone=${noHpTujuan}&text=${encodedText}`;
      
      window.open(waUrl, '_blank');

      // JEDA 2 DETIK agar browser tidak memblokir pop-up beruntun
      if (i < selectedData.length - 1) {
        await new Promise(resolve => setTimeout(resolve, 2000));
      }
    }
  }

  // 6. FITUR KIRIM GABUNGAN (ALL-IN-1 WA)
  function kirimPesanGabungan() {
    const selectedData = getCheckedRows();
    
    if (selectedData.length === 0) {
      alert("Pilih/centang minimal satu data untuk digabungkan!");
      return;
    }

    const noHpTujuan = prompt("Masukkan Nomor WA Tujuan (Contoh: 628123456789):");
    if (!noHpTujuan) return;

    let pesanGabungan = `*REKAP DATA TERPILIH (${selectedData.length} ITEM)*\n`;
    pesanGabungan += `==========================\n\n`;

    selectedData.forEach((item, index) => {
      pesanGabungan += `*${index + 1}. ${item.namaLama || 'No Name'}*\n`;
      pesanGabungan += `• CID: ${item.cidLama || '-'}\n`;
      pesanGabungan += `• ODP: ${item.odp || '-'}\n`;
      pesanGabungan += `• POP: ${item.pop || '-'}\n`;
      pesanGabungan += `• SN: ${item.snUnit || '-'}\n`;
      pesanGabungan += `• Sheet: ${item.sheetAsal || '-'}\n`;
      pesanGabungan += `--------------------------\n`;
    });

    const encodedText = encodeURIComponent(pesanGabungan);
    const waUrl = `https://api.whatsapp.com/send?phone=${noHpTujuan}&text=${encodedText}`;
    
    window.open(waUrl, '_blank');
  }

  // 7. CHECK ALL
  function toggleSelectAll(masterCheckbox) {
    const checkboxes = document.querySelectorAll('.row-checkbox');
    checkboxes.forEach(cb => cb.checked = masterCheckbox.checked);
  }
</script>

</body>
</html>
