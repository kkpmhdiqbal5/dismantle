<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Dismantle Lapangan</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-xl rounded-lg shadow-md overflow-hidden border border-gray-200">
        <div class="bg-blue-600 text-white text-center py-4 text-xl font-semibold shadow-inner">
            Form Dismantle Lapangan
        </div>

        <form id="dismantleForm" class="p-6 space-y-4">
            <!-- Indikator GPS -->
            <div class="text-center">
                <div id="gpsStatus" class="inline-block bg-orange-100 text-orange-600 text-sm font-medium px-4 py-2 rounded border border-orange-200">
                    Mengunci Titik Koordinat GPS...
                </div>
                <input type="hidden" id="latLongInput" name="koordinat_gps">
            </div>

            <!-- Input Fields -->
            <div>
                <label class="block text-gray-700 font-medium text-sm mb-1">Nama / Kode ODP</label>
                <input type="text" name="nama_odp" placeholder="Ketik Nama ODP..." class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-gray-700 font-medium text-sm mb-1">Nama / Kode POP</label>
                <input type="text" name="nama_pop" placeholder="Ketik Nama POP..." class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-gray-700 font-medium text-sm mb-1">CID Lama <span class="text-gray-400 font-normal">(Boleh Kosong)</span></label>
                <input type="text" name="cid_lama" placeholder="Masukkan nomor CID lama jika ada" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-gray-700 font-medium text-sm mb-1">Nama Lama <span class="text-red-500">*Wajib Diisi</span></label>
                <input type="text" name="nama_lama" required placeholder="Masukkan nama pelanggan lama..." class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-gray-700 font-medium text-sm mb-1">Foto Rumah</label>
                <input type="file" id="fotoRumah" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-gray-200 file:text-gray-700 hover:file:bg-gray-300 cursor-pointer">
            </div>

            <div>
                <label class="block text-gray-700 font-medium text-sm mb-1">Foto Perangkat & Scan Barcode</label>
                <input type="file" id="fotoPerangkat" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-gray-200 file:text-gray-700 hover:file:bg-gray-300 cursor-pointer">
            </div>

            <div>
                <label class="block text-gray-700 font-medium text-sm mb-1">Serial Number (SN) <span class="text-red-500">*Wajib Terisi</span></label>
                <input type="text" id="serialNumber" name="serial_number" required placeholder="Menunggu foto stiker perangkat..." class="w-full border border-gray-300 rounded px-3 py-2 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <p class="text-xs text-gray-400 mt-1 leading-relaxed">
                    Sistem akan otomatis memindai barcode begitu Anda mengambil "Foto Perangkat". Jika stiker kotor/buram, Anda bisa langsung mengetik kodenya secara manual di kolom ini.
                </p>
            </div>

            <div>
                <label class="block text-gray-700 font-medium text-sm mb-1">Keterangan <span class="text-gray-400 font-normal">(Boleh Kosong)</span></label>
                <textarea name="keterangan" rows="3" placeholder="Catatan tambahan di lapangan..." class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded transition duration-200 shadow-sm text-sm disabled:bg-gray-400">
                Kirim Data Lapangan
            </button>
        </form>
    </div>

    <script>
        // SILAHKAN PASTE URL WEB APP BARU ANDA DI SINI
        const SCRIPT_URL = "PASTE_URL_WEB_APP_APPS_SCRIPT_DISINI";

        // 1. LOGIKA GEOLOCATION GPS
        window.addEventListener('DOMContentLoaded', () => {
            const gpsStatus = document.getElementById('gpsStatus');
            const latLongInput = document.getElementById('latLongInput');
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude.toFixed(6);
                        const long = position.coords.longitude.toFixed(6);
                        gpsStatus.textContent = `GPS Terkunci: ${lat}, ${long}`;
                        gpsStatus.classList.replace('bg-orange-100', 'bg-green-100');
                        gpsStatus.classList.replace('text-orange-600', 'text-green-600');
                        gpsStatus.classList.replace('border-orange-200', 'border-green-200');
                        latLongInput.value = `${lat},${long}`;
                    },
                    () => {
                        gpsStatus.textContent = "Gagal Mengunci GPS (Izin Ditolak/Rendah Sinyal)";
                        gpsStatus.classList.replace('bg-orange-100', 'bg-red-100');
                        gpsStatus.classList.replace('text-orange-600', 'text-red-600');
                    }
                );
            }
        });

        // 2. SIMULASI OTOMATIS SCAN BARCODE
        const fotoPerangkat = document.getElementById('fotoPerangkat');
        const serialNumber = document.getElementById('serialNumber');
        fotoPerangkat.addEventListener('change', function(e) {
            if(e.target.files.length > 0) {
                serialNumber.placeholder = "Sedang memindai gambar...";
                setTimeout(() => {
                    const randomSN = "SN-" + Math.random().toString(36).substr(2, 9).toUpperCase();
                    serialNumber.value = randomSN;
                }, 1200);
            }
        });

        // Fungsi Helper Mengubah File ke Base64 String
        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]); // Ambil base64 string-nya saja
            reader.onerror = error => reject(error);
        });

        // 3. PROSES PENGIRIMAN DATA KE GOOGLE SHEET
        document.getElementById('dismantleForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = "Mengirim Data & Mengunggah Foto...";

            try {
                const searchParams = new URLSearchParams();
                
                // Ambil semua input teks biasa
                const formData = new FormData(this);
                for (const pair of formData.entries()) {
                    searchParams.append(pair[0], pair[1]);
                }

                // Ambil file Foto Rumah
                const fileRumahInput = document.getElementById('fotoRumah');
                if (fileRumahInput.files.length > 0) {
                    const file1 = fileRumahInput.files[0];
                    const b64_1 = await toBase64(file1);
                    searchParams.append('foto_rumah_base64', b64_1);
                    searchParams.append('foto_rumah_type', file1.type);
                    searchParams.append('foto_rumah_name', file1.name);
                }

                // Ambil file Foto Perangkat
                const filePerangkatInput = document.getElementById('fotoPerangkat');
                if (filePerangkatInput.files.length > 0) {
                    const file2 = filePerangkatInput.files[0];
                    const b64_2 = await toBase64(file2);
                    searchParams.append('foto_perangkat_base64', b64_2);
                    searchParams.append('foto_perangkat_type', file2.type);
                    searchParams.append('foto_perangkat_name', file2.name);
                }

                // Kirim data menggunakan metode POST ke Apps Script
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: searchParams,
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    }
                });

                const result = await response.json();
                if (result.result === "success") {
                    alert("Sukses! Data lapangan berhasil disimpan. Foto Rumah & Foto Perangkat telah masuk ke folder masing-masing.");
                    this.reset();
                    document.getElementById('gpsStatus').textContent = "Mengunci Titik Koordinat GPS...";
                    document.getElementById('gpsStatus').className = "inline-block bg-orange-100 text-orange-600 text-sm font-medium px-4 py-2 rounded border border-orange-200";
                } else {
alert("Gagal menyimpan data: " + result.error);}} catch (error) {console.error(error);alert("Terjadi kesalahan koneksi saat mengirim data lapangan.");} finally {submitBtn.disabled = false;submitBtn.textContent = "Kirim Data Lapangan";}});
